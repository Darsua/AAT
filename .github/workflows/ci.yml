name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test, Vet & Config Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Go 1.22
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: |
            go.work.sum
            services/**/go.sum

      - name: Go Vet
        run: |
          go vet ./services/aggregator/... \
                 ./services/auth/... \
                 ./services/client-api/... \
                 ./services/consumers/dashboard/... \
                 ./services/consumers/notifier/... \
                 ./services/mock-bmkg/... \
                 ./services/mock-pvmbg/...

      - name: Run Go Tests with Race Detection
        env:
          GOFLAGS: -race
          CGO_ENABLED: '1'
        run: make test

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Setup Python for Repository Checks
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install YAML Parser
        run: python -m pip install PyYAML==6.0.3

      - name: Test Repository Checker and Contract Structure
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check YAML and JSON Syntax and Empty Secret Templates
        run: python scripts/check_repository.py configs

      - name: Check Documentation Links, Fences and Mermaid Sources
        run: python scripts/check_repository.py docs

  docker-build:
    name: Build Docker Container (${{ matrix.service }})
    needs: test-and-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: aggregator
            context: ./services/aggregator
          - service: auth
            context: ./services/auth
          - service: client-api
            context: ./services/client-api
          - service: dashboard
            context: ./services/consumers/dashboard
          - service: notifier
            context: ./services/consumers/notifier
          - service: mock-bmkg
            context: ./services/mock-bmkg
          - service: mock-pvmbg
            context: ./services/mock-pvmbg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Service Container
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: bnpb/${{ matrix.service }}:ci

  security-and-hygiene:
    name: Tracked File and Common Secret Pattern Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup Python for Hygiene Checks
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Check Tracked Secret Filenames and Common Token/Key Patterns
        run: python scripts/check_repository.py hygiene
