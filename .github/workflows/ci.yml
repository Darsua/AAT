name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test, Vet & Config Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Go Work Sync
        run: go work sync

      - name: Go Vet
        run: |
          go vet ./services/aggregator/... \
                 ./services/auth/... \
                 ./services/client-api/... \
                 ./services/mock-bmkg/... \
                 ./services/mock-pvmbg/...

      - name: Run Go Unit Tests
        run: |
          go test -v ./services/aggregator/... \
                     ./services/auth/... \
                     ./services/client-api/... \
                     ./services/mock-bmkg/... \
                     ./services/mock-pvmbg/...

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Setup Python for Contract Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate OpenAPI & JSON Schemas
        run: |
          python -m pip install pyyaml
          python -c "
          import yaml, json, glob
          for y in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              with open(y) as f:
                  yaml.safe_load(f)
              print(f'Valid YAML: {y}')
          for j in glob.glob('**/*.json', recursive=True):
              with open(j) as f:
                  json.load(f)
              print(f'Valid JSON: {j}')
          "

  docker-build:
    name: Build Docker Container (${{ matrix.service }})
    needs: test-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - aggregator
          - auth
          - client-api
          - mock-bmkg
          - mock-pvmbg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Service Container
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: bnpb/${{ matrix.service }}:ci

  security-and-hygiene:
    name: Security & Secret Leak Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets or .env Files
        run: |
          # Allow .env.example, but reject actual .env secrets (.env, .env.local, .env.prod, etc.)
          if git ls-files | grep -E "(^|/)\.env" | grep -v "\.env\.example$"; then
            echo "::error::Found committed .env file! Secrets must only exist in environment variables."
            exit 1
          fi
          echo "No committed .env files found. Secret hygiene verified."
