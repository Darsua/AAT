version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "gomod"
    directory: "/services/aggregator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/auth"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/client-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/mock-bmkg"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/mock-pvmbg"
    schedule:
      interval: "weekly"
