# Sharded + High-Availability Compose overlay for local M2 rehearsal.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sharded.yml up --build -d

x-store-base: &store-base
  image: postgres:16-alpine
  environment: &store-env
    POSTGRES_USER: ${POSTGRES_USER:-bnpb_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    POSTGRES_DB: ${POSTGRES_DB:-bnpb_hazards}
  volumes:
    - ./scripts/init_sharded_postgres.sh:/docker-entrypoint-initdb.d/01-create-shards.sh:ro
  networks:
    - bnpb-internal
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bnpb_user} -d $${POSTGRES_DB:-bnpb_hazards}"]
    interval: 5s
    timeout: 3s
    retries: 5

x-sharded-aggregator-env: &sharded-aggregator-env
  PORT: 8083
  DATABASE_URL: postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-aqua:5432/bnpb_shard_1?sslmode=disable
  SHARD_CONFIG: >-
    shard-1=shard-1|aqua|primary|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-aqua:5432/bnpb_shard_1?sslmode=disable,shard-1-r1|ruby|replica|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-ruby:5432/bnpb_shard_1_r1?sslmode=disable;shard-2=shard-2|ruby|primary|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-ruby:5432/bnpb_shard_2?sslmode=disable,shard-2-r1|akane|replica|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-akane:5432/bnpb_shard_2_r1?sslmode=disable;shard-3=shard-3|akane|primary|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-akane:5432/bnpb_shard_3?sslmode=disable,shard-3-r1|aqua|replica|postgres://${POSTGRES_USER:-bnpb_user}:${POSTGRES_PASSWORD:-}@store-aqua:5432/bnpb_shard_3_r1?sslmode=disable
  REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
  TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
  REDPANDA_TOPIC_FIELD_REPORTS: ${REDPANDA_TOPIC_FIELD_REPORTS:-bnpb.field-reports}
  CONSUMER_GROUP_FIELD_REPORTS: ${CONSUMER_GROUP_FIELD_REPORTS:-bnpb-aggregator-field-reports}
  BMKG_URL: ${BMKG_URL:-http://mock-bmkg:8081}
  BMKG_KEY: ${BMKG_API_KEY:-}
  PVMBG_URL: ${PVMBG_URL:-http://mock-pvmbg:8082}
  PVMBG_TOKEN: ${PVMBG_TOKEN:-}
  SENSOR_PANTAI_URL: ${SENSOR_PANTAI_URL:-http://sensor-pantai:8080}
  PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-}
  COASTAL_POLL_INTERVAL_SECS: ${COASTAL_POLL_INTERVAL_SECS:-2}
  COASTAL_TIMEOUT_MS: ${COASTAL_TIMEOUT_MS:-2000}
  COASTAL_FRESHNESS_TTL_SECS: ${COASTAL_FRESHNESS_TTL_SECS:-30}
  POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS:-3}
  AUDIT_TOKEN: ${AUDIT_TOKEN:-}
  AUDIT_ALL_SOURCES_LABEL: ${AUDIT_ALL_SOURCES_LABEL:-ALL}
  NODE_NAME: ${NODE_NAME:-aqua}
  STORAGE_UNIT_ID: ${STORAGE_UNIT_ID:-shard-1}
  LEASE_TTL_SECS: ${LEASE_TTL_SECS:-15}
  LEASE_RENEW_INTERVAL_SECS: ${LEASE_RENEW_INTERVAL_SECS:-5}
  DRAIN_DELAY_MS: ${DRAIN_DELAY_MS:-3000}
  SATELLITE_ENABLED: ${SATELLITE_ENABLED:-false}
  SATELLITE_URL: ${SATELLITE_URL:-https://satellite.naufarrel.dev}
  SATELLITE_GROUP_TOKEN: ${SATELLITE_GROUP_TOKEN:-}
  SATELLITE_LATENESS_MINUTES: ${SATELLITE_LATENESS_MINUTES:-360}
  SATELLITE_STATE_RETENTION_HOURS: ${SATELLITE_STATE_RETENTION_HOURS:-48}
  SATELLITE_PROVINCE_CENTROIDS_FILE: ${SATELLITE_PROVINCE_CENTROIDS_FILE:-}
  PVMBG_FIELD_ALIASES: ${PVMBG_FIELD_ALIASES:-}
  PVMBG_COERCE_NUMERIC_STRINGS: ${PVMBG_COERCE_NUMERIC_STRINGS:-false}
  DLQ_RETRY_BUDGET: ${DLQ_RETRY_BUDGET:-5}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}

x-sharded-aggregator-deps: &sharded-aggregator-deps
  store-aqua:
    condition: service_healthy
  store-ruby:
    condition: service_healthy
  store-akane:
    condition: service_healthy
  redpanda:
    condition: service_healthy
  redpanda-init:
    condition: service_completed_successfully
  mock-bmkg:
    condition: service_healthy
  mock-pvmbg:
    condition: service_healthy
  sensor-pantai:
    condition: service_healthy

services:
  store-aqua:
    <<: *store-base
    environment:
      <<: *store-env
      SHARD_DBS: "bnpb_shard_1 bnpb_shard_3_r1"
    ports:
      - "127.0.0.1:${STORE_AQUA_PORT:-5433}:5432"
    volumes:
      - store-aqua-data:/var/lib/postgresql/data
      - ./scripts/init_sharded_postgres.sh:/docker-entrypoint-initdb.d/01-create-shards.sh:ro

  store-ruby:
    <<: *store-base
    environment:
      <<: *store-env
      SHARD_DBS: "bnpb_shard_2 bnpb_shard_1_r1"
    ports:
      - "127.0.0.1:${STORE_RUBY_PORT:-5434}:5432"
    volumes:
      - store-ruby-data:/var/lib/postgresql/data
      - ./scripts/init_sharded_postgres.sh:/docker-entrypoint-initdb.d/01-create-shards.sh:ro

  store-akane:
    <<: *store-base
    environment:
      <<: *store-env
      SHARD_DBS: "bnpb_shard_3 bnpb_shard_2_r1"
    ports:
      - "127.0.0.1:${STORE_AKANE_PORT:-5435}:5432"
    volumes:
      - store-akane-data:/var/lib/postgresql/data
      - ./scripts/init_sharded_postgres.sh:/docker-entrypoint-initdb.d/01-create-shards.sh:ro

  aggregator:
    environment:
      <<: *sharded-aggregator-env
      INSTANCE_ID: aggregator-1
      NODE_NAME: aqua
    depends_on:
      <<: *sharded-aggregator-deps

  aggregator-2:
    build: ./services/aggregator
    environment:
      <<: *sharded-aggregator-env
      INSTANCE_ID: aggregator-2
      NODE_NAME: ruby
    depends_on:
      <<: *sharded-aggregator-deps
    ports:
      - "127.0.0.1:${AGGREGATOR_2_PORT:-18083}:8083"
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  aggregator-3:
    build: ./services/aggregator
    environment:
      <<: *sharded-aggregator-env
      INSTANCE_ID: aggregator-3
      NODE_NAME: akane
    depends_on:
      <<: *sharded-aggregator-deps
    ports:
      - "127.0.0.1:${AGGREGATOR_3_PORT:-28083}:8083"
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  store-aqua-data:
  store-ruby-data:
  store-akane-data:
