name: bnpb-aat

services:
  canonical-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bnpb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bnpb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bnpb_hazards}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./services/aggregator/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bnpb_user} -d $${POSTGRES_DB:-bnpb_hazards}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command: redpanda start --smp 1 --memory 256M --overprovisioned --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 --advertise-kafka-addr internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if rpk topic describe "$${TOPIC}" -X brokers=redpanda:9092 >/dev/null 2>&1; then
          echo "Topic '$${TOPIC}' already exists"
        else
          rpk topic create "$${TOPIC}" \
            --partitions "$${TOPIC_PARTITIONS}" \
            --replicas 1 \
            -X brokers=redpanda:9092
        fi
        partition_metadata="$$(rpk topic describe "$${TOPIC}" --print-partitions -X brokers=redpanda:9092)"
        printf '%s\n' "$${partition_metadata}"
        actual_partitions="$$(printf '%s\n' "$${partition_metadata}" | awk 'NR > 1 && $$1 ~ /^[0-9]+$$/ { count++ } END { print count + 0 }')"
        if [ "$${actual_partitions}" -ne "$${TOPIC_PARTITIONS}" ]; then
          echo "Expected $${TOPIC_PARTITIONS} partitions for '$${TOPIC}', found $${actual_partitions}" >&2
          exit 1
        fi
    environment:
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - bnpb-internal
    restart: "no"

  mock-bmkg:
    build: ./services/mock-bmkg
    ports:
      - "${MOCK_BMKG_PORT:-8081}:8081"
    environment:
      PORT: 8081
      BMKG_API_KEY: ${BMKG_API_KEY:-bmkg-secret-key-2026}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-pvmbg:
    build: ./services/mock-pvmbg
    ports:
      - "${MOCK_PVMBG_PORT:-8082}:8082"
    environment:
      PORT: 8082
      PVMBG_TOKEN: ${PVMBG_TOKEN:-pvmbg-bearer-token-2026}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  aggregator:
    build: ./services/aggregator
    environment:
      PORT: 8083
      DATABASE_URL: ${DATABASE_URL:-postgres://bnpb_user:bnpb_secret@canonical-db:5432/bnpb_hazards?sslmode=disable}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      BMKG_URL: ${BMKG_URL:-http://mock-bmkg:8081}
      BMKG_KEY: ${BMKG_API_KEY:-bmkg-secret-key-2026}
      PVMBG_URL: ${PVMBG_URL:-http://mock-pvmbg:8082}
      PVMBG_TOKEN: ${PVMBG_TOKEN:-pvmbg-bearer-token-2026}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS:-3}
    depends_on:
      canonical-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      mock-bmkg:
        condition: service_healthy
      mock-pvmbg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGGREGATOR_PORT:-8083}:8083"
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build: ./services/auth
    ports:
      - "${AUTH_PORT:-8084}:8084"
    environment:
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-60}
      AUTH_MEDIA_CLIENT_ID: ${AUTH_MEDIA_CLIENT_ID:-test-media-client}
      AUTH_MEDIA_CLIENT_SECRET: ${AUTH_MEDIA_CLIENT_SECRET:-secret123}
      AUTH_FIELD_CLIENT_ID: ${AUTH_FIELD_CLIENT_ID:-test-field-client}
      AUTH_FIELD_CLIENT_SECRET: ${AUTH_FIELD_CLIENT_SECRET:-secret123}
      AUTH_INTERNAL_CLIENT_ID: ${AUTH_INTERNAL_CLIENT_ID:-test-internal-client}
      AUTH_INTERNAL_CLIENT_SECRET: ${AUTH_INTERNAL_CLIENT_SECRET:-secret123}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  client-api:
    build: ./services/client-api
    ports:
      - "${CLIENT_API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      AGGREGATOR_URL: ${AGGREGATOR_URL:-http://aggregator:8083}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
    depends_on:
      aggregator:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # Downstream Consumers (Jenka / Member C)
  # Consumers are designed, structured, and created entirely by Jenka.
  # See services/consumers/README.md for specifications and pub-sub guidelines.
  # The two blocks below are EXAMPLES only (naming, paths, and group IDs are
  # illustrative). Rename/restructure freely to match your actual
  # implementation, then uncomment and configure:
  # ==============================================================================
  # <your-consumer-1>: # e.g. dashboard-consumer
  #   build: ./services/consumers/<your-consumer-1-dir> # e.g. dashboard
  #   environment:
  #     REDPANDA_BROKERS: redpanda:9092
  #     CONSUMER_GROUP: ${CONSUMER_GROUP_DASHBOARD:-bnpb-dashboard-group} # rename the env var too if you don't keep this role name
  #     TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
  #   depends_on:
  #     redpanda:
  #       condition: service_healthy
  #   networks:
  #     - bnpb-internal
  #
  # <your-consumer-2>: # e.g. notifier-consumer
  #   build: ./services/consumers/<your-consumer-2-dir> # e.g. notifier
  #   environment:
  #     REDPANDA_BROKERS: redpanda:9092
  #     CONSUMER_GROUP: ${CONSUMER_GROUP_NOTIFIER:-bnpb-notifier-group} # rename the env var too if you don't keep this role name
  #     TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
  #   depends_on:
  #     redpanda:
  #       condition: service_healthy
  #   networks:
  #     - bnpb-internal

volumes:
  db-data:
  redpanda-data:

networks:
  bnpb-internal:
    internal: true
  bnpb-public:
    driver: bridge
