name: bnpb-aat

services:
  canonical-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bnpb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bnpb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bnpb_hazards}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./services/aggregator/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bnpb_user} -d $${POSTGRES_DB:-bnpb_hazards}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command: redpanda start --smp 1 --memory 256M --overprovisioned --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 --advertise-kafka-addr internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in "$${TOPIC}" "$${FIELD_REPORTS_TOPIC}"; do
          if rpk topic describe "$${topic}" -X brokers=redpanda:9092 >/dev/null 2>&1; then
            echo "Topic '$${topic}' already exists"
          else
            rpk topic create "$${topic}" \
              --partitions "$${TOPIC_PARTITIONS}" \
              --replicas 1 \
              -X brokers=redpanda:9092
          fi
          partition_metadata="$$(rpk topic describe "$${topic}" --print-partitions -X brokers=redpanda:9092)"
          printf '%s\n' "$${partition_metadata}"
          actual_partitions="$$(printf '%s\n' "$${partition_metadata}" | awk 'NR > 1 && $$1 ~ /^[0-9]+$$/ { count++ } END { print count + 0 }')"
          if [ "$${actual_partitions}" -ne "$${TOPIC_PARTITIONS}" ]; then
            echo "Expected $${TOPIC_PARTITIONS} partitions for '$${topic}', found $${actual_partitions}" >&2
            exit 1
          fi
        done
    environment:
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      FIELD_REPORTS_TOPIC: ${REDPANDA_TOPIC_FIELD_REPORTS:-bnpb.field-reports}
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - bnpb-internal
    restart: "no"

  mock-bmkg:
    build: ./services/mock-bmkg
    ports:
      - "${MOCK_BMKG_PORT:-8081}:8081"
    environment:
      PORT: 8081
      BMKG_API_KEY: ${BMKG_API_KEY:-bmkg-secret-key-2026}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-pvmbg:
    build: ./services/mock-pvmbg
    ports:
      - "${MOCK_PVMBG_PORT:-8082}:8082"
    environment:
      PORT: 8082
      PVMBG_TOKEN: ${PVMBG_TOKEN:-pvmbg-bearer-token-2026}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    environment:
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-pantai-secret-token-2026}
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  aggregator:
    build: ./services/aggregator
    environment:
      PORT: 8083
      DATABASE_URL: ${DATABASE_URL:-postgres://bnpb_user:bnpb_secret@canonical-db:5432/bnpb_hazards?sslmode=disable}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      REDPANDA_TOPIC_FIELD_REPORTS: ${REDPANDA_TOPIC_FIELD_REPORTS:-bnpb.field-reports}
      CONSUMER_GROUP_FIELD_REPORTS: ${CONSUMER_GROUP_FIELD_REPORTS:-bnpb-aggregator-field-reports}
      BMKG_URL: ${BMKG_URL:-http://mock-bmkg:8081}
      BMKG_KEY: ${BMKG_API_KEY:-bmkg-secret-key-2026}
      PVMBG_URL: ${PVMBG_URL:-http://mock-pvmbg:8082}
      PVMBG_TOKEN: ${PVMBG_TOKEN:-pvmbg-bearer-token-2026}
      SENSOR_PANTAI_URL: ${SENSOR_PANTAI_URL:-http://sensor-pantai:8080}
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-pantai-secret-token-2026}
      COASTAL_POLL_INTERVAL_SECS: ${COASTAL_POLL_INTERVAL_SECS:-2}
      COASTAL_TIMEOUT_MS: ${COASTAL_TIMEOUT_MS:-2000}
      COASTAL_FRESHNESS_TTL_SECS: ${COASTAL_FRESHNESS_TTL_SECS:-30}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS:-3}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-audit-secret-token-2026}
      AUDIT_ALL_SOURCES_LABEL: ${AUDIT_ALL_SOURCES_LABEL:-ALL}
      NODE_NAME: ${NODE_NAME:-local}
      STORAGE_UNIT_ID: ${STORAGE_UNIT_ID:-shard-1}
      LEASE_TTL_SECS: ${LEASE_TTL_SECS:-15}
      LEASE_RENEW_INTERVAL_SECS: ${LEASE_RENEW_INTERVAL_SECS:-5}
      SATELLITE_ENABLED: ${SATELLITE_ENABLED:-false}
      SATELLITE_URL: ${SATELLITE_URL:-https://satellite.naufarrel.dev}
      SATELLITE_GROUP_TOKEN: ${SATELLITE_GROUP_TOKEN:-}
      SATELLITE_LATENESS_MINUTES: ${SATELLITE_LATENESS_MINUTES:-360}
      SATELLITE_STATE_RETENTION_HOURS: ${SATELLITE_STATE_RETENTION_HOURS:-48}
      SATELLITE_PROVINCE_CENTROIDS_FILE: ${SATELLITE_PROVINCE_CENTROIDS_FILE:-}
      PVMBG_FIELD_ALIASES: ${PVMBG_FIELD_ALIASES:-}
      PVMBG_COERCE_NUMERIC_STRINGS: ${PVMBG_COERCE_NUMERIC_STRINGS:-false}
      DLQ_RETRY_BUDGET: ${DLQ_RETRY_BUDGET:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    depends_on:
      canonical-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      mock-bmkg:
        condition: service_healthy
      mock-pvmbg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGGREGATOR_PORT:-8083}:8083"
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build: ./services/auth
    ports:
      - "${AUTH_PORT:-8084}:8084"
    environment:
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-60}
      AUTH_MEDIA_CLIENT_ID: ${AUTH_MEDIA_CLIENT_ID:-test-media-client}
      AUTH_MEDIA_CLIENT_SECRET: ${AUTH_MEDIA_CLIENT_SECRET:-media-secret-2026}
      AUTH_FIELD_CLIENT_ID: ${AUTH_FIELD_CLIENT_ID:-test-field-client}
      AUTH_FIELD_CLIENT_SECRET: ${AUTH_FIELD_CLIENT_SECRET:-field-secret-2026}
      AUTH_INTERNAL_CLIENT_ID: ${AUTH_INTERNAL_CLIENT_ID:-test-internal-client}
      AUTH_INTERNAL_CLIENT_SECRET: ${AUTH_INTERNAL_CLIENT_SECRET:-internal-secret-2026}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  client-api:
    build: ./services/client-api
    ports:
      - "${CLIENT_API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      AGGREGATOR_URL: ${AGGREGATOR_URL:-http://aggregator:8083}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      REDPANDA_TOPIC_FIELD_REPORTS: ${REDPANDA_TOPIC_FIELD_REPORTS:-bnpb.field-reports}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      QOS_MAX_CONCURRENT: ${QOS_MAX_CONCURRENT:-100}
      QOS_MEDIA_SHED_THRESHOLD: ${QOS_MEDIA_SHED_THRESHOLD:-70}
    depends_on:
      aggregator:
        condition: service_healthy
      auth:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard-consumer:
    build: ./services/consumers/dashboard
    ports:
      - "${DASHBOARD_PORT:-8085}:8085"
    environment:
      REDPANDA_BROKERS: redpanda:9092
      PORT: 8085
      CONSUMER_GROUP: ${CONSUMER_GROUP_DASHBOARD:-bnpb-dashboard-group}
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      AGGREGATOR_URL: ${AGGREGATOR_URL:-http://aggregator:8083}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - bnpb-internal
      - bnpb-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  notifier-consumer:
    build: ./services/consumers/notifier
    environment:
      REDPANDA_BROKERS: redpanda:9092
      PORT: 8086
      CONSUMER_GROUP: ${CONSUMER_GROUP_NOTIFIER:-bnpb-notifier-group}
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      NOTIFIER_RECEIPT_LOG: ${NOTIFIER_RECEIPT_LOG:-/tmp/notifier-receipts.jsonl}
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  summarizer-consumer:
    build: ./services/consumers/summarizer
    environment:
      REDPANDA_BROKERS: redpanda:9092
      PORT: 8087
      CONSUMER_GROUP: ${CONSUMER_GROUP_SUMMARIZER:-bnpb-summarizer-group}
      TOPIC: ${KAFKA_TOPIC_HAZARDS:-bnpb.hazard-events}
      AI_API_URL: ${AI_API_URL:-http://10.5.24.125:11434/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_MAX_CALLS_PER_MIN: ${AI_MAX_CALLS_PER_MIN:-12}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - bnpb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bnpb-internal
      - bnpb-public
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    networks:
      - bnpb-internal
      - bnpb-public
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - bnpb-internal
      - bnpb-public
    restart: unless-stopped

volumes:
  db-data:
  redpanda-data:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  bnpb-internal:
    internal: true
  bnpb-public:
    driver: bridge
