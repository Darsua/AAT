server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_bytes: 1048576
  max_block_duration: 5m
  trace_idle_period: 5s

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    block:
      version: vParquet3
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    pool:
      max_workers: 10
      queue_depth: 200
