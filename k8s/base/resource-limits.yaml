apiVersion: v1
kind: LimitRange
metadata:
  name: table-b-resource-limits
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: governance
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "256Mi"
      max:
        cpu: "2000m"
        memory: "1Gi"
      min:
        cpu: "20m"
        memory: "32Mi"
