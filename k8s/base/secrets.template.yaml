apiVersion: v1
kind: Secret
metadata:
  name: bnpb-credentials
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
type: Opaque
stringData:
  # Shared HMAC key for JWT issuance and verification
  JWT_SECRET: "bnpb-insecure-default-jwt-secret-m2"

  # Official assistant satellite stream token (shared for satellite.naufarrel.dev and video submission)
  SATELLITE_GROUP_TOKEN: "AcplbAZCrK2N2etXvvuxYxIaoqtXM0b0t4A0kEsJrp4"

  # Coastal sensor blackbox bearer auth token (Lampiran C)
  PANTAI_AUTH_TOKEN: "pantai-secret-bearer-token"

  # Internal audit bearer token for assistant grading harness (Lampiran A)
  AUDIT_TOKEN: "bnpb-internal-audit-token-m2"

  # Canonical storage database credentials
  POSTGRES_USER: "bnpb_user"
  POSTGRES_PASSWORD: "bnpb_password"
  POSTGRES_DB: "bnpb_canonical"

  # Upstream mock keys
  BMKG_API_KEY: "bmkg-secret-key-123"
  PVMBG_BEARER_TOKEN: "pvmbg-bearer-token-456"
