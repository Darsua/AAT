apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-storage-strict
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: security
spec:
  podSelector:
    matchLabels:
      role: store
  policyTypes:
    - Ingress
  ingress:
    # Course Invariant #2: Storage is owned strictly by aggregator.
    # Non-aggregator application components (client-api, auth, consumers, mocks, sensors)
    # are strictly barred at the network level from connecting to storage.
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
        - podSelector:
            matchLabels:
              role: store
      ports:
        - protocol: TCP
          port: 5432
    # Ensure tester-agent test harness is never blocked per course contract
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-broker-policy
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: security
spec:
  podSelector:
    matchLabels:
      role: broker
  policyTypes:
    - Ingress
  ingress:
    # Broker Kafka port accepts aggregator, api, consumer, and peer broker traffic
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
        - podSelector:
            matchLabels:
              role: api
        - podSelector:
            matchLabels:
              role: consumer
        - podSelector:
            matchLabels:
              role: broker
      ports:
        - protocol: TCP
          port: 9092
    # Broker admin/metrics port (9644) is restricted to broker peers and observability scrapers
    - from:
        - podSelector:
            matchLabels:
              role: broker
        - podSelector:
            matchLabels:
              role: other
      ports:
        - protocol: TCP
          port: 9644
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mock-admin-policy
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: security
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["mock", "sensor"]
  policyTypes:
    - Ingress
  ingress:
    # Ingestion poller from Aggregator
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8080
    # Administrative endpoints (/admin/outage, /admin/schema-version) invoked by tester-agent
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8080
    # Metrics scraping from observability workloads (Prometheus)
    - from:
        - podSelector:
            matchLabels:
              role: other
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controllers
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: security
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["api", "consumer", "other"]
  policyTypes:
    - Ingress
  ingress:
    # Permit HTTP ingress from Traefik / kube-system ingress controllers, tester-agent, and application peers
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["api", "aggregator", "consumer", "other"]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-aggregator-policy
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
    component: security
spec:
  podSelector:
    matchLabels:
      role: aggregator
  policyTypes:
    - Ingress
  ingress:
    # Restrict Aggregator HTTP/Audit port (8083) to ingress controllers, tester-agent, and trusted service roles
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["api", "aggregator", "consumer", "other"]
      ports:
        - protocol: TCP
          port: 8083
