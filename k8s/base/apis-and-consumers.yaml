apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: auth
    role: api
spec:
  selector:
    app: auth
    role: api
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: auth
    role: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
      role: api
  template:
    metadata:
      labels:
        app: auth
        role: api
    spec:
      containers:
        - name: auth
          image: bnpb-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: PORT
              value: "8084"
          envFrom:
            - configMapRef:
                name: bnpb-config
            - secretRef:
                name: bnpb-credentials
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
