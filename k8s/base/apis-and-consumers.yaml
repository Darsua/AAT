apiVersion: v1
kind: Service
metadata:
  name: dashboard-consumer
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: dashboard-consumer
    role: consumer
spec:
  selector:
    app: dashboard-consumer
    role: consumer
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-consumer
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: dashboard-consumer
    role: consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-consumer
      role: consumer
  template:
    metadata:
      labels:
        app: dashboard-consumer
        role: consumer
    spec:
      containers:
        - name: dashboard-consumer
          image: bnpb-dashboard-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: bnpb-config
                  key: CONSUMER_GROUP_DASHBOARD
          envFrom:
            - configMapRef:
                name: bnpb-config
            - secretRef:
                name: bnpb-credentials
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
