apiVersion: v1
kind: Service
metadata:
  name: mock-bmkg
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: mock-bmkg
    role: mock
spec:
  selector:
    app: mock-bmkg
    role: mock
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bmkg
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: mock-bmkg
    role: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-bmkg
      role: mock
  template:
    metadata:
      labels:
        app: mock-bmkg
        role: mock
    spec:
      containers:
        - name: mock-bmkg
          image: bnpb-mock-bmkg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: BMKG_API_KEY
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-pvmbg
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: mock-pvmbg
    role: mock
spec:
  selector:
    app: mock-pvmbg
    role: mock
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-pvmbg
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: mock-pvmbg
    role: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-pvmbg
      role: mock
  template:
    metadata:
      labels:
        app: mock-pvmbg
        role: mock
    spec:
      containers:
        - name: mock-pvmbg
          image: bnpb-mock-pvmbg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: PVMBG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: PVMBG_TOKEN
            - name: PVMBG_DELAY_MIN_MS
              value: "500"
            - name: PVMBG_DELAY_MAX_MS
              value: "3000"
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
