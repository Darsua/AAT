  bnpb-satellite-ingestion.json: |
    {
      "uid": "bnpb-satellite-ingestion",
      "title": "Satellite Wildfire & Upstream Ingestion",
      "tags": ["bnpb", "m2", "observability"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "links": [
        {
          "title": "BNPB Dashboards",
          "type": "dashboards",
          "tags": ["bnpb"],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active Streaming Instances",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 },
                  { "color": "orange", "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(satellite_streaming)",
              "legendFormat": "Active Leader"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Current Satellite Feed Lag",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 50 },
                  { "color": "red", "value": 500 }
                ]
              }
