            "overrides": []
          },
          "targets": [
            {
              "expr": "max(satellite_lag_events and on (instance) (satellite_streaming == 1))",
              "legendFormat": "Lag (events)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Active Open Wildfire Clusters",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "max(satellite_active_fires and on (instance) (satellite_streaming == 1))",
              "legendFormat": "Open Fires"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Fenced Checkpoint Payload Size",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "max(satellite_checkpoint_bytes and on (instance) (satellite_streaming == 1))",
              "legendFormat": "Bytes"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Satellite Processing Lag (Events Behind Live Feed)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "max(satellite_lag_events and on (instance) (satellite_streaming == 1))",
              "legendFormat": "lag (events)"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Satellite Stream Offsets (Last Applied vs Feed Latest)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "max(satellite_last_applied_offset and on (instance) (satellite_streaming == 1))",
              "legendFormat": "last applied offset"
            },
            {
              "expr": "max(satellite_latest_offset and on (instance) (satellite_streaming == 1))",
              "legendFormat": "feed latest offset"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Satellite Ingress-to-Persist Latency (p95)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(satellite_event_persist_duration_seconds_bucket[1m])))",
              "legendFormat": "p95 (1m histogram)"
            },
            {
              "expr": "max(satellite_p95_persist_seconds and on (instance) (satellite_streaming == 1))",
              "legendFormat": "p95 (rolling 1000 events)"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Wildfire Cluster Lifecycle & Detection Dispositions",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "max(satellite_active_fires and on (instance) (satellite_streaming == 1))",
              "legendFormat": "open fires"
            },
            {
              "expr": "max(satellite_closed_fires and on (instance) (satellite_streaming == 1))",
              "legendFormat": "closed fires"
            },
            {
              "expr": "max(satellite_singletons and on (instance) (satellite_streaming == 1))",
              "legendFormat": "singletons"
            },
            {
              "expr": "max(satellite_late_detections and on (instance) (satellite_streaming == 1))",
              "legendFormat": "late beyond watermark"
            },
            {
              "expr": "max(satellite_unknown_references and on (instance) (satellite_streaming == 1))",
              "legendFormat": "updates/retracts for unknown keys"
            },
            {
              "expr": "max(satellite_rejected_events and on (instance) (satellite_streaming == 1))",
              "legendFormat": "rejected events"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Satellite Ingestion Rate & Leader Election Across Aggregator Pods",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "max(rate(satellite_last_applied_offset[1m]) and on (instance) (satellite_streaming == 1))",
              "legendFormat": "events/s applied"
            },
            {
              "expr": "satellite_streaming",
              "legendFormat": "streaming flag ({{instance}})"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Upstream Mock Provider Polling Throughput & Latency (BMKG / PVMBG)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by (service, status) (rate(http_requests_total{service=~\"mock-bmkg|mock-pvmbg\"}[1m]))",
              "legendFormat": "{{service}} HTTP {{status}} / s"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~\"mock-bmkg|mock-pvmbg\"}[1m])))",
              "legendFormat": "p95 latency {{service}} (s)"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: tempo
    role: other
spec:
  selector:
    app: tempo
    role: other
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: tempo
    role: other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
      role: other
  template:
    metadata:
      labels:
        app: tempo
        role: other
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/tempo.yaml"
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
              readOnly: true
            - name: tempo-data
              mountPath: /tmp/tempo
      volumes:
        - name: tempo-config
          configMap:
            name: bnpb-observability-config
        - name: tempo-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: prometheus
    role: other
spec:
  selector:
    app: prometheus
    role: other
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: prometheus
    role: other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      role: other
  template:
    metadata:
      labels:
        app: prometheus
        role: other
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=6h"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: bnpb-observability-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: grafana
    role: other
spec:
  selector:
    app: grafana
    role: other
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: grafana
    role: other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      role: other
  template:
    metadata:
      labels:
        app: grafana
        role: other
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-provisioning
          configMap:
            name: bnpb-observability-config
        - name: grafana-dashboards
          configMap:
            name: bnpb-grafana-dashboards
        - name: grafana-data
          emptyDir: {}
