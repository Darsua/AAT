apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-observability-config
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "client-api"
        dns_sd_configs:
          - names: ["client-api-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
            type: A
            port: 8080

      - job_name: "auth"
        static_configs:
          - targets: ["auth:8084"]

      - job_name: "aggregator"
        dns_sd_configs:
          - names: ["aggregator-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
            type: A
            port: 8083

      - job_name: "dashboard-consumer"
        dns_sd_configs:
          - names: ["dashboard-consumer-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
            type: A
            port: 8085

      - job_name: "notifier-consumer"
        dns_sd_configs:
          - names: ["notifier-consumer-headless.sistem-informasi-kebencanaan-bnpb.svc.cluster.local"]
            type: A
            port: 8086

      - job_name: "summarizer-consumer"
        static_configs:
          - targets: ["summarizer-consumer:8087"]

      - job_name: "mock-bmkg"
        static_configs:
          - targets: ["mock-bmkg:8081"]

      - job_name: "mock-pvmbg"
        static_configs:
          - targets: ["mock-pvmbg:8082"]

      - job_name: "redpanda"
        metrics_path: /public_metrics
        static_configs:
          - targets: ["redpanda:9644"]

  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: "0.0.0.0:4318"
            grpc:
              endpoint: "0.0.0.0:4317"

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal

  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Tempo
        uid: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false

  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "BNPB Observability"
        orgId: 1
        folder: "BNPB"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-grafana-dashboards
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
data:
  bnpb-unified-observability.json: |
    {
      "uid": "bnpb-unified-obs",
      "title": "Platform Overview & API Gateway",
      "tags": ["bnpb", "m2", "observability"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "links": [
        {
          "title": "BNPB Dashboards",
          "type": "dashboards",
          "tags": ["bnpb"],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "id": 100,
          "type": "stat",
          "title": "Healthy Scrape Targets",
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 10 },
                  { "color": "green", "value": 14 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up)",
              "legendFormat": "UP"
            }
          ]
        },
        {
          "id": 101,
          "type": "stat",
          "title": "Active Aggregator Replicas",
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 2 },
                  { "color": "green", "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up{job=\"aggregator\"})",
              "legendFormat": "Replicas"
            }
          ]
        },
        {
          "id": 102,
          "type": "stat",
          "title": "Active Gateway Replicas",
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up{job=\"client-api\"})",
              "legendFormat": "Replicas"
            }
          ]
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Satellite Stream Leader",
          "gridPos": { "h": 4, "w": 5, "x": 15, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 },
                  { "color": "orange", "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(satellite_streaming)",
              "legendFormat": "Leader"
            }
          ]
        },
        {
          "id": 104,
          "type": "stat",
          "title": "AI Summarizer Circuit",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "CLOSED", "color": "green" },
                    "1": { "text": "OPEN", "color": "red" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(bnpb_summarizer_circuit_open)",
              "legendFormat": "Circuit"
            }
          ]
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Throughput (RPS) by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Request Latency (p50 / p95 / p99)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, service) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "p50 {{service}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "p95 {{service}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "p99 {{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP Error Rates (4xx / 5xx) by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (service, status) (rate(http_requests_total{status=~\"[45]..\"}[1m]))",
              "legendFormat": "{{service}} HTTP {{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "OAuth2 Token Issuance & Authentication Failures",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (grant_type) (rate(auth_tokens_issued_total[1m]))",
              "legendFormat": "issued ({{grant_type}})"
            },
            {
              "expr": "sum by (reason) (rate(auth_token_failures_total[1m]))",
              "legendFormat": "auth failure ({{reason}})"
            },
            {
              "expr": "sum by (reason) (rate(auth_rejections_total[1m]))",
              "legendFormat": "gateway rejection ({{reason}})"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Gateway Priority QoS Shedding (HTTP 429) vs Admitted Traffic",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{service=\"client-api\"}[1m]))",
              "legendFormat": "client-api HTTP {{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Per-Replica HTTP Request Distribution (HA Load Balancing)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (service, instance) (rate(http_requests_total{service=~\"aggregator|client-api\"}[1m]))",
              "legendFormat": "{{service}} @ {{instance}}"
            }
          ]
        }
      ]
    }
  bnpb-event-pipeline.json: |
    {
      "uid": "bnpb-event-pipeline",
      "title": "Event Pipeline, Redpanda & Consumers",
      "tags": ["bnpb", "m2", "observability"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "links": [
        {
          "title": "BNPB Dashboards",
          "type": "dashboards",
          "tags": ["bnpb"],
          "asDropdown": false,
