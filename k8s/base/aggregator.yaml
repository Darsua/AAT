apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: aggregator
    role: aggregator
spec:
  selector:
    app: aggregator
    role: aggregator
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: aggregator
    role: aggregator
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aggregator
      role: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
              role: aggregator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: aggregator
                    role: aggregator
      containers:
        - name: aggregator
          image: bnpb-aggregator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Cluster-specific egress proxy defaults for ITB environment
            - name: HTTP_PROXY
              value: "http://10.5.24.112:8888"
            - name: HTTPS_PROXY
              value: "http://10.5.24.112:8888"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local,10.5.24.0/22,10.42.0.0/16,10.43.0.0/16,store-aqua,store-ruby,store-akane,redpanda,mock-bmkg,mock-pvmbg,sensor-pantai,aggregator,auth,client-api,tempo,prometheus,grafana"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: POSTGRES_PASSWORD
            - name: AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: AUDIT_TOKEN
            - name: BMKG_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: BMKG_KEY
            - name: PVMBG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: PVMBG_TOKEN
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: PANTAI_AUTH_TOKEN
            - name: SATELLITE_GROUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-credentials
                  key: SATELLITE_GROUP_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: bnpb-config
          resources:
            requests:
              # CPU request is the HPA utilization baseline (autoscaling.yaml); the CPU limit is the LimitRange default (500m).
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
