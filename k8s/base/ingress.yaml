apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bnpb-ingress
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
spec:
  ingressClassName: traefik
  rules:
    - host: aat.darsu.dev
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8084
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-api
                port:
                  number: 8080
    - host: audit.aat.darsu.dev
      http:
        paths:
          - path: /internal/audit
            pathType: Prefix
            backend:
              service:
                name: aggregator
                port:
                  number: 8083
