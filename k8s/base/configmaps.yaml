apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-config
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: bnpb-platform
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

  # Internal microservice addresses
  AGGREGATOR_URL: "http://aggregator:8083"
  CLIENT_API_URL: "http://client-api:8080"
  AUTH_SERVICE_URL: "http://auth:8084"
  AUTH_URL: "http://auth:8084"
  REDPANDA_BROKERS: "redpanda:9092"

  # Upstream simulation & feed addresses
  BMKG_URL: "http://mock-bmkg:8081"
  PVMBG_URL: "http://mock-pvmbg:8082"
  SENSOR_PANTAI_URL: "http://sensor-pantai:8080"
  SATELLITE_URL: "https://satellite.naufarrel.dev"

  # Poller, JWT, and client identity settings
  POLL_INTERVAL_SECS: "3"
  JWT_TTL_SECONDS: "60"
  AUTH_MEDIA_CLIENT_ID: "test-media-client"
  AUTH_FIELD_CLIENT_ID: "test-field-client"
  AUTH_INTERNAL_CLIENT_ID: "test-internal-client"
  NODE_NAME: "local"
  STORAGE_UNIT_ID: "shard-1"
  AUDIT_ALL_SOURCES_LABEL: "ALL"
  LEASE_TTL_SECS: "15"
  LEASE_RENEW_INTERVAL_SECS: "5"
  DRAIN_DELAY_MS: "3000"
  STORE_NODE_1: "aqua"
  STORE_NODE_2: "ruby"
  STORE_NODE_3: "kana"
  SHARD_CONFIG: "shard-1=shard-1|${STORE_NODE_1}|primary|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-aqua:5432/bnpb_shard_1?sslmode=disable,shard-1-r1|${STORE_NODE_2}|replica|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-ruby:5432/bnpb_shard_1_r1?sslmode=disable;shard-2=shard-2|${STORE_NODE_2}|primary|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-ruby:5432/bnpb_shard_2?sslmode=disable,shard-2-r1|${STORE_NODE_3}|replica|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-kana:5432/bnpb_shard_2_r1?sslmode=disable;shard-3=shard-3|${STORE_NODE_3}|primary|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-kana:5432/bnpb_shard_3?sslmode=disable,shard-3-r1|${STORE_NODE_1}|replica|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@store-aqua:5432/bnpb_shard_3_r1?sslmode=disable"

  # Redpanda / Kafka topic and consumer group definitions
  TOPIC: "bnpb.hazard-events"
  REDPANDA_TOPIC_HAZARDS: "bnpb.hazard-events"
  REDPANDA_TOPIC_FIELD_REPORTS: "bnpb.field-reports"
  REDPANDA_TOPIC_DLQ: "bnpb.dlq"
  CONSUMER_GROUP_DASHBOARD: "bnpb-dashboard-group"
  CONSUMER_GROUP_NOTIFIER: "bnpb-notifier-group"
